<div class="auth-page container">
    <div class="auth-card glass-card animate-fade">
        @if (!isSuccess) {
        <div class="auth-header text-center">
            <span class="logo-icon">SB</span>
            <h1>New Password</h1>
            <p>Please enter your new secure password below.</p>
        </div>

        <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
            <div *ngIf="error" class="error-badge">{{ error }}</div>

            <div class="form-group">
                <label>New Password</label>
                <div class="input-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" required [(ngModel)]="password" name="password" placeholder="••••••••"
                        class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" required [(ngModel)]="confirmPassword" name="confirm" placeholder="••••••••"
                        class="form-control">
                </div>
            </div>

            <button type="submit" class="btn-primary w-full" [disabled]="!resetForm.valid || isLoading">
                <span *ngIf="!isLoading">Update Password</span>
                <span *ngIf="isLoading" class="spinner-small"></span>
            </button>
        </form>
        } @else {
        <div class="success-state text-center animate-fade">
            <div class="success-icon">🎉</div>
            <h1>Password Updated</h1>
            <p>Your password has been changed successfully. Redirecting you to login...</p>
            <div class="actions">
                <a routerLink="/login" class="btn-primary w-full">Go to Login Now</a>
            </div>
        </div>
        }
    </div>
</div>
