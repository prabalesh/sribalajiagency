<div class="home-mobile-wrapper">
    <!-- Hero Section -->
    <app-hero [cms]="cms"></app-hero>

    <!-- Category Grid -->
    <app-category-grid [categories]="categories" [showCategories]="cms?.showCategories"></app-category-grid>

    <!-- Featured Products -->
    <app-featured-products [products]="featuredProducts" [showFeatured]="cms?.showFeatured"
        (addToCart)="onAddToCart($event)">
    </app-featured-products>

    <!-- About Section -->
    <app-about-section [cms]="cms"></app-about-section>

    <!-- Brand Shelf -->
    <app-brand-shelf [brands]="brands" [showBrands]="cms?.showBrands"></app-brand-shelf>

    <!-- Trust Markers -->
    <app-trust-markers [showTrustMarkers]="cms?.showTrustMarkers"></app-trust-markers>

    <!-- Social Section -->
    <app-social-section [socialLinks]="cms?.socialLinks"></app-social-section>
</div>
