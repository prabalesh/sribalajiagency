@if (showTrustMarkers !== false) {
<section class="trust-markers container">
    <div class="marker glass-card">
        <div class="marker-icon">
            <lucide-icon [img]="Truck" [size]="32" class="icons"></lucide-icon>
        </div>
        <div class="marker-text">
            <h4>Rapid 24h Delivery</h4>
            <p>Available on select items in major hubs.</p>
        </div>
    </div>
    <div class="marker glass-card">
        <div class="marker-icon">
            <lucide-icon [img]="ShieldCheck" [size]="32" class="icons"></lucide-icon>
        </div>
        <div class="marker-text">
            <h4>Genuine Brand Warranty</h4>
            <p>Direct manufacturer support for all products.</p>
        </div>
    </div>
    <div class="marker glass-card">
        <div class="marker-icon">
            <lucide-icon [img]="MessageCircle" [size]="32" class="icons"></lucide-icon>
        </div>
        <div class="marker-text">
            <h4>Expert Consultation</h4>
            <p>Talk to our product specialists anytime.</p>
        </div>
    </div>
</section>
}
