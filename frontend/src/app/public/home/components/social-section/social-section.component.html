@if (socialLinks && socialLinks.length > 0) {
<section class="social-section container">
    <div class="section-header">
        <div>
            <span class="sub-header">COMMUNITY</span>
            <h2>Follow Our Journey</h2>
        </div>
    </div>
    <div class="social-grid">
        @for (link of socialLinks; track $index) {
        <a [href]="link.url" target="_blank" class="social-card glass-card">
            <span class="social-index">{{ link.platform }}</span>
            <span class="social-arrow">
                <lucide-icon [img]="ExternalLink" [size]="20"></lucide-icon>
            </span>
        </a>
        }
    </div>
</section>
}
