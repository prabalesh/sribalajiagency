<div class="brands-container">
    <h1>Our Brands</h1>
    <div class="brand-grid">
        @for (brand of brands; track brand.id) {
        <div class="brand-card glass-card clickable" [routerLink]="['/brands', brand.slug]">
            <div class="logo-area">
                @if (brand.image) {
                <img [src]="brand.image | imageUrl" [alt]="brand.name">
                } @else {
                <div class="brand-placeholder">{{ brand.name.charAt(0) }}</div>
                }
            </div>
            <div class="brand-info">
                <h3>{{ brand.name }}</h3>
                <p>{{ brand.description || 'No description available' }}</p>
            </div>
        </div>
        }
    </div>
</div>
