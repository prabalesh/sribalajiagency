<div class="brand-detail-page container">
    <header class="brand-header animate-fade" *ngIf="brand">
        <div class="brand-logo glass-card" *ngIf="brand.image">
            <img [src]="brand.image | imageUrl" [alt]="brand.name">
        </div>
        <div class="brand-info">
            <h1 class="text-gradient">{{ brand.name }}</h1>
            <p>{{ brand.description }}</p>
        </div>
    </header>

    <section class="categories-section">
        <h2>Categories available from {{ brand?.name }}</h2>

        <div class="category-grid" *ngIf="!isLoading; else loadingTemplate">
            @for (cat of categories; track cat.id) {
            <div class="category-card glass-card animate-fade" [routerLink]="['/brands', brand?.slug, cat.slug]">
                <div class="cat-image" *ngIf="cat.imageUrl">
                    <img [src]="cat.imageUrl | imageUrl" [alt]="cat.name">
                </div>
                <div class="cat-info">
                    <h3>{{ cat.name }}</h3>
                </div>
            </div>
            }
            @if (categories.length === 0) {
            <p class="no-results">No categories found for this brand.</p>
            }
        </div>

        <ng-template #loadingTemplate>
            <div class="category-grid">
                @for (i of [1,2,3,4]; track i) {
                <div class="category-card skeleton-card glass-card">
                    <app-skeleton height="150px" width="100%"></app-skeleton>
                    <div style="padding: 1rem;">
                        <app-skeleton height="20px" width="60%"></app-skeleton>
                    </div>
                </div>
                }
            </div>
        </ng-template>
    </section>
</div>
