<div class="form-group full-width permissions-section">
    <div class="permissions-header">
        <div class="header-left">
            <label class="form-label">
                <lucide-icon [img]="Key" [size]="16"></lucide-icon>
                <span>Assigned Permissions</span>
            </label>
            <span class="selection-count">
                {{ getSelectedCount() }} of {{ getTotalCount() }} selected
            </span>
        </div>
        <div class="header-actions">
            <button type="button" class="btn-link" (click)="onSelectAll()" [disabled]="isSaving">
                Select All
            </button>
            <button type="button" class="btn-link" (click)="onDeselectAll()" [disabled]="isSaving">
                Clear All
            </button>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="permissions-controls">
        <div class="search-box">
            <lucide-icon [img]="Search" [size]="18"></lucide-icon>
            <input type="text" class="search-input" [(ngModel)]="searchTerm" [ngModelOptions]="{standalone: true}"
                placeholder="Search permissions..." [disabled]="isSaving">
        </div>

        <div class="filter-box">
            <lucide-icon [img]="Filter" [size]="18"></lucide-icon>
            <select class="filter-select" [(ngModel)]="selectedCategory" [ngModelOptions]="{standalone: true}"
                [disabled]="isSaving">
                @for (cat of permissionCategories; track cat) {
                <option [value]="cat">{{ cat | uppercase }}</option>
                }
            </select>
        </div>
    </div>

    <!-- Permissions Grid -->
    <div class="permissions-grid">
        @for (p of filteredPermissions; track p.id) {
        <label class="permission-card" [class.selected]="selectedPermissionIds.includes(p.id)">
            <input type="checkbox" class="permission-checkbox" [checked]="selectedPermissionIds.includes(p.id)"
                (change)="onToggle(p.id)" [disabled]="isSaving">
            <div class="permission-content">
                <div class="permission-icon">
                    <lucide-icon [img]="selectedPermissionIds.includes(p.id) ? ShieldCheck : Shield" [size]="20">
                    </lucide-icon>
                </div>
                <div class="permission-info">
                    <strong class="permission-name">{{ p.name }}</strong>
                    <span class="permission-desc">{{ p.description }}</span>
                </div>
            </div>
        </label>
        } @empty {
        <div class="empty-permissions">
            <lucide-icon [img]="AlertCircle" [size]="48"></lucide-icon>
            <p>No permissions found matching your criteria</p>
        </div>
        }
    </div>
</div>
