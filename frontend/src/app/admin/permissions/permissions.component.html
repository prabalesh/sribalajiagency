<div class="permissions-page">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-content">
            <h1 class="page-title">
                <lucide-icon [img]="Shield" [size]="32"></lucide-icon>
                <span>Roles & Access Control</span>
            </h1>
            <p class="page-subtitle">Define user roles and assign granular system permissions</p>
        </div>
    </div>

    <!-- Stats Cards (Mobile Only) -->
    <div class="stats-cards mobile-only">
        <div class="stat-card glass-card">
            <lucide-icon [img]="Shield" [size]="24"></lucide-icon>
            <div class="stat-content">
                <span class="stat-value">{{ roles.length }}</span>
                <span class="stat-label">Total Roles</span>
            </div>
        </div>
        <div class="stat-card glass-card">
            <lucide-icon [img]="Key" [size]="24"></lucide-icon>
            <div class="stat-content">
                <span class="stat-value">{{ permissions.length }}</span>
                <span class="stat-label">Permissions</span>
            </div>
        </div>
    </div>

    <!-- Create/Edit Form -->
    @if (authService.hasPermission('MANAGE_ROLES')) {
    <app-role-form [newRole]="newRole" [isEditing]="isEditing" [isSaving]="isSaving" [permissions]="permissions"
        (save)="saveRole()" (cancel)="resetForm()">
    </app-role-form>
    }

    <!-- Roles List -->
    <app-role-list [roles]="roles" [isLoading]="isLoading" [isDeleting]="isDeleting" [isSaving]="isSaving"
        (edit)="editRole($event)" (delete)="deleteRole($event)">
    </app-role-list>
</div>
