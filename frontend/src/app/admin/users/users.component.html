<div class="crud-container">
    <h1>Manage Users</h1>

    <div class="crud-layout">
        <!-- Add/Edit User Form -->
        <div class="form-card">
            <h3>{{ isEditing ? 'Edit User' : 'Add New User' }}</h3>
            <form (ngSubmit)="saveUser()">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" [(ngModel)]="newUser.name" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" [(ngModel)]="newUser.email" name="email" required
                        placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select [(ngModel)]="newUser.role" name="role" required>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="actions">
                    <button type="submit" class="btn-primary">{{ isEditing ? 'Update User' : 'Add User' }}</button>
                    @if (isEditing) {
                    <button type="button" (click)="resetForm()" class="btn-secondary">Cancel</button>
                    }
                </div>
            </form>
        </div>

        <!-- Users List -->
        <div class="list-card">
            <h3>Existing Users</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    @for (user of users; track user.id) {
                    <tr>
                        <td>{{ user.name }}</td>
                        <td>{{ user.email }}</td>
                        <td>
                            <span class="badge" [ngClass]="user.roles[0].name">{{ user.roles[0].name || 'user'
                                }}</span>

                        </td>
                        <td>
                            <button class="btn-icon" (click)="editUser(user)">Edit</button>
                            <button class="btn-icon delete" (click)="deleteUser(user.id)">Delete</button>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
