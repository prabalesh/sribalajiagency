<div class="dashboard-container">
    <header class="page-header">
        <h1>Dashboard Overview</h1>
        <p>Live statistics from Sri Balaji Agency</p>
    </header>

    <div class="stats-grid">
        @for (stat of stats; track stat.label) {
        <div class="stat-card glass-card animate-fade">
            <div class="stat-icon" [style.background-color]="stat.color + '22'" [style.color]="stat.color">
                {{ stat.icon }}
            </div>
            <div class="stat-info">
                <h3>{{ stat.value }}</h3>
                <p>{{ stat.label }}</p>
            </div>
        </div>
        }
    </div>

    <!-- Additional sections like Recent Orders or Quick Actions could go here -->
</div>
