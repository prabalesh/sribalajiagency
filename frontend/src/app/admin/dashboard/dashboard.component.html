<div class="dashboard-container">
    <header class="page-header">
        <h1>Dashboard Overview</h1>
        <p>Live statistics from Sri Balaji Agency</p>
    </header>

    <div class="stats-grid">
        @if (isLoading) {
        @for (i of [1,2,3]; track i) {
        <div class="stat-card glass-card">
            <app-skeleton width="40px" height="40px" shape="circle" style="margin-bottom: 12px;"></app-skeleton>
            <app-skeleton width="100px" height="32px" style="margin-bottom: 8px;"></app-skeleton>
            <app-skeleton width="60px" height="16px"></app-skeleton>
        </div>
        }
        } @else {
        @for (item of filteredStats(); track item.label) {
        <div class="stat-card glass-card" [style.border-top]="'3px solid ' + item.color">
            <div class="stat-icon">{{ item.icon }}</div>
            <div class="stat-value text-gradient">{{ item.value | number }}</div>
            <div class="stat-label">{{ item.label }}</div>
        </div>
        }
        }
    </div>

    <!-- Additional sections like Recent Orders or Quick Actions could go here -->
</div>
