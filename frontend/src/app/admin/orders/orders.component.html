<div class="admin-orders-page">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-content">
            <h1 class="page-title">
                <lucide-icon [img]="ShoppingCart" [size]="32"></lucide-icon>
                <span>Order Management</span>
            </h1>
            <p class="page-subtitle">Manage and track all orders</p>
        </div>
    </div>

    <!-- Queue Tabs -->
    <app-order-queue-tabs [activeTab]="activeTab" (tabChange)="onTabChange($event)">
    </app-order-queue-tabs>

    <!-- Filters Bar -->
    <app-order-filters [searchTerm]="searchTerm" [statusFilter]="statusFilter" [startDate]="startDate"
        [endDate]="endDate" [statusOptions]="statusOptions" (searchTermChange)="searchTerm = $event"
        (statusFilterChange)="statusFilter = $event" (startDateChange)="startDate = $event"
        (endDateChange)="endDate = $event" (apply)="loadOrders()" (reset)="resetFilters(); loadOrders()">
    </app-order-filters>

    <!-- Orders List -->
    <app-order-list [orders]="orders" [isLoading]="isLoading" [totalItems]="totalItems" [itemsPerPage]="itemsPerPage"
        [currentPage]="currentPage" (edit)="onEditOrder($event)" (pageChange)="onPageChange($event)">
    </app-order-list>

    <!-- Status Update Modal -->
    <app-order-status-modal [isOpen]="showStatusModal" [order]="selectedOrder" [isUpdating]="isUpdating"
        [statusOptions]="statusOptions" (close)="onCloseModal()" (save)="onUpdateStatus($event)">
    </app-order-status-modal>
</div>
