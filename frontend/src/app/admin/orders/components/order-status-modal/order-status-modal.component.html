@if (isOpen && order) {
<div class="modal-overlay" (click)="onClose()">
    <div class="modal-content glass-card" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>
                <lucide-icon [img]="Edit" [size]="24"></lucide-icon>
                <span>Update Status</span>
            </h2>
            <button class="btn-icon-close" (click)="onClose()">
                <lucide-icon [img]="X" [size]="20"></lucide-icon>
            </button>
        </div>

        <div class="modal-body">
            <div class="order-summary">
                <p class="order-id"><strong>Order #{{ getTruncatedId(order.id) }}</strong></p>
                <p class="customer">
                    <lucide-icon [img]="User" [size]="16"></lucide-icon>
                    {{ order.user?.name }}
                </p>
                <p class="amount">
                    <lucide-icon [img]="IndianRupee" [size]="16"></lucide-icon>
                    ₹{{ order.totalAmount | number:'1.2-2' }}
                </p>
            </div>

            <div class="form-group">
                <label for="status" class="form-label">
                    <lucide-icon [img]="Package" [size]="16"></lucide-icon>
                    <span>New Status</span>
                </label>
                <select id="status" [(ngModel)]="newStatus" class="form-control" [disabled]="isUpdating">
                    <option value="">Select Status</option>
                    @for (status of statusOptions; track status) {
                    <option [value]="status">{{ status }}</option>
                    }
                </select>
            </div>

            <div class="form-group">
                <label for="message" class="form-label">
                    <lucide-icon [img]="Mail" [size]="16"></lucide-icon>
                    <span>Status Message (Optional)</span>
                </label>
                <textarea id="message" [(ngModel)]="statusMessage"
                    placeholder="Add a message regarding this status update..." rows="3" class="form-control"
                    [disabled]="isUpdating"></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-secondary" (click)="onClose()" [disabled]="isUpdating">
                Cancel
            </button>
            <button class="btn-primary" (click)="onSave()" [disabled]="!newStatus || isUpdating">
                @if (isUpdating) {
                <span class="spinner-sm"></span>
                <span>Updating...</span>
                } @else {
                <lucide-icon [img]="Check" [size]="18"></lucide-icon>
                <span>Update Status</span>
                }
            </button>
        </div>
    </div>
</div>
}
