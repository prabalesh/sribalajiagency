<div class="crud-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-content">
            <h1 class="page-title">
                <lucide-icon [img]="Package" [size]="32"></lucide-icon>
                <span>Product Inventory</span>
            </h1>
            <p class="page-subtitle">Manage your catalog, variants, and high-quality images</p>
        </div>
    </div>

    <!-- Add/Edit Product Form -->
    @if (authService.hasPermission('CREATE_PRODUCT') || (isEditing && authService.hasPermission('UPDATE_PRODUCT'))) {
    <app-product-form [product]="newProduct" [isEditing]="isEditing" [isSaving]="isSaving"
        [isUploadingImage]="isUploadingImage" [brands]="brands" [categories]="categories"
        [selectedCategoryId]="selectedCategoryId" (save)="saveProduct()" (cancel)="resetForm()"
        (addVariant)="addVariant()" (removeVariant)="removeVariant($event)"
        (variantFileSelected)="onVariantFileSelected($event)" 
        (variantFilesSelected)="onVariantFilesSelected($event)"
        (variantUrlChanged)="onVariantUrlChanged($event)"
        (variantImageRemoved)="onVariantImageRemoved($event)" (categoryChange)="onCategoryChange($event)"
        (paymentMethodToggle)="togglePaymentMethod($event)" [variantTypes]="variantTypes">
    </app-product-form>
    }

    <!-- Products List -->
    <app-product-list [products]="products" [isLoading]="isLoading" [isDeleting]="isDeleting" [isSaving]="isSaving"
        [totalItems]="totalItems" [itemsPerPage]="itemsPerPage" [currentPage]="currentPage" [searchQuery]="searchQuery"
        (edit)="editProduct($event)" (delete)="deleteProduct($event)" (search)="onSearchInput($event)"
        (pageChange)="onPageChange($event)">
    </app-product-list>
</div>
