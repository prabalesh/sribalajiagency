<div class="crud-container">
    <h1>Feedback Moderation</h1>

    <table class="data-table">
        <thead>
            <tr>
                <th>User</th>
                <th>Rating</th>
                <th>Comment</th>
                <th>Approved</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            @for (item of feedbacks; track item.id) {
            <tr>
                <td>{{ item.userName }}</td>
                <td>{{ item.rating }} / 5</td>
                <td>{{ item.comment }}</td>
                <td>
                    <span class="status-indicator" [class.approved]="item.isApproved">
                        {{ item.isApproved ? 'Yes' : 'No' }}
                    </span>
                </td>
                <td>
                    <button (click)="toggleApproval(item)">
                        {{ item.isApproved ? 'Reject' : 'Approve' }}
                    </button>
                    <button class="delete" (click)="deleteFeedback(item.id)">Delete</button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
