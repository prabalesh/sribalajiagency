<div class="crud-container">
  <h1>Manage Brands</h1>

  <div class="form-card">
    <h3>{{ isEditing ? 'Edit Brand' : 'Add New Brand' }}</h3>
    <form (ngSubmit)="addBrand()">
      <div class="form-row">
        <input type="text" [(ngModel)]="newBrand.name" name="name" placeholder="Brand Name" required>
        <input type="text" [(ngModel)]="newBrand.description" name="description" placeholder="Description">
        <button type="submit" class="btn-primary">{{ isEditing ? 'Update' : 'Add' }}</button>
        @if (isEditing) {
        <button type="button" (click)="resetForm()">Cancel</button>
        }
      </div>
    </form>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (brand of brands; track brand.id) {
      <tr>
        <td>{{ brand.name }}</td>
        <td>{{ brand.description }}</td>
        <td>
          <button (click)="editBrand(brand)">Edit</button>
          <button (click)="deleteBrand(brand.id)" class="delete">Delete</button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
