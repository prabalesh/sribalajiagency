<div class="quote-container">
    <h1>Request a Quotation</h1>
    <p class="subtitle">Get the best price for your industrial needs.</p>

    <form (ngSubmit)="onSubmit()" #form="ngForm" class="quote-form">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required [(ngModel)]="quoteForm.name" name="name" class="form-control">
        </div>

        <div class="row">
            <div class="form-group col">
                <label for="email">Email</label>
                <input type="email" id="email" required [(ngModel)]="quoteForm.email" name="email" class="form-control">
            </div>
            <div class="form-group col">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" required [(ngModel)]="quoteForm.phone" name="phone" class="form-control">
            </div>
        </div>

        <div class="form-group">
            <label for="product">Product of Interest</label>
            <input type="text" id="product" [(ngModel)]="quoteForm.productName" name="productName" class="form-control"
                placeholder="E.g., Bosch Drill X500">
        </div>

        <div class="form-group">
            <label for="message">Additional Requirements</label>
            <textarea id="message" [(ngModel)]="quoteForm.message" name="message" rows="4"
                class="form-control"></textarea>
        </div>

        <button type="submit" class="btn-primary" [disabled]="!form.valid">Send Request</button>
    </form>
</div>
