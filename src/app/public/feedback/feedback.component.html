<div class="feedback-container">
    <h1>Customer Feedback</h1>

    <div class="feedback-form-section">
        <h2>Leave your Feedback</h2>
        <form (ngSubmit)="onSubmit()" #form="ngForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required [(ngModel)]="feedbackForm.name" name="name" class="form-control">
            </div>

            <div class="form-group">
                <label for="rating">Rating</label>
                <select id="rating" required [(ngModel)]="feedbackForm.rating" name="rating" class="form-control">
                    <option [value]="5">5 - Excellent</option>
                    <option [value]="4">4 - Good</option>
                    <option [value]="3">3 - Average</option>
                    <option [value]="2">2 - Poor</option>
                    <option [value]="1">1 - Terrible</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comment">Comment</label>
                <textarea id="comment" required [(ngModel)]="feedbackForm.comment" name="comment" rows="4"
                    class="form-control"></textarea>
            </div>

            <button type="submit" class="btn-primary" [disabled]="!form.valid">Submit Feedback</button>
        </form>
    </div>

    <div class="recent-feedbacks">
        <h2>Recent Reviews</h2>
        @for (review of recentFeedbacks; track review.name) {
        <div class="review-card">
            <div class="header">
                <span class="name">{{ review.name }}</span>
                <span class="rating">★ {{ review.rating }}</span>
            </div>
            <p>{{ review.comment }}</p>
        </div>
        }
    </div>
</div>
