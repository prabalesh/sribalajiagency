<div class="auth-page container">
    <div class="auth-card glass-card animate-fade">
        @if (!isSubmitted) {
        <div class="auth-header text-center">
            <span class="logo-icon">SB</span>
            <h1>Reset Password</h1>
            <p>Enter your email and we'll send you instructions to reset your password.</p>
        </div>

        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" required [(ngModel)]="email" name="email" placeholder="you@example.com"
                        class="form-control">
                </div>
            </div>

            <button type="submit" class="btn-primary w-full" [disabled]="!forgotForm.valid || isLoading">
                <span *ngIf="!isLoading">Send Instructions</span>
                <span *ngIf="isLoading" class="spinner-small"></span>
            </button>
        </form>

        <div class="auth-footer text-center">
            <p>Wait, I remember it! <a routerLink="/login">Go back to login</a></p>
        </div>
        } @else {
        <div class="success-state text-center animate-fade">
            <div class="success-icon">✉️</div>
            <h1>Check Your Email</h1>
            <p>We've sent password reset instructions to <strong>{{ email }}</strong>. Please check your inbox.</p>
            <div class="actions">
                <button class="btn-primary w-full" (click)="isSubmitted = false">Try Different Email</button>
                <a routerLink="/login" class="btn-secondary w-full">Back to Login</a>
            </div>
        </div>
        }
    </div>
</div>
