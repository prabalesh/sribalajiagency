<div class="auth-page container">
    <div class="auth-card glass-card animate-fade">
        <div class="auth-header text-center">
            <span class="logo-icon">SB</span>
            <h1>Welcome Back</h1>
            <p>Enter your details to access your account.</p>
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div *ngIf="error" class="error-badge">{{ error }}</div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" required [(ngModel)]="email" name="email" placeholder="you@example.com"
                        class="form-control">
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label>Password</label>
                    <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
                </div>
                <div class="input-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" required [(ngModel)]="password" name="password" placeholder="••••••••"
                        class="form-control">
                </div>
            </div>

            <button type="submit" class="btn-primary w-full" [disabled]="!loginForm.valid || isLoading">
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading" class="spinner-small"></span>
            </button>
        </form>

        <div class="auth-footer text-center">
            <p>Don't have an account? <a routerLink="/register">Create one for free</a></p>
        </div>
    </div>
</div>
