server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # REPLACE with your actual domain

    root /var/www/sribalajiagency/frontend;
    index index.html;

    # Frontend (Angular Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api/ {
        # remove /api/ prefix if your NestJS app doesn't have global prefix 'api'
        # rewrite ^/api/(.*) /$1 break; 
        
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve Static Uploads (if any)
    location /uploads/ {
        alias /var/www/sribalajiagency/backend/uploads/;
    }
}
