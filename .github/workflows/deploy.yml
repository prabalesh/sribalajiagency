name: Deploy to Hetzner

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Install root dependencies
      - name: Install root dependencies
        run: npm install

      # Backend Build
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # Deploy Backend
      - name: Deploy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/dist/*,backend/package.json,backend/package-lock.json"
          target: "/home/${{ secrets.SSH_USERNAME }}/sribalajiagency/"
          strip_components: 0
          overwrite: true

      # Restart Services
      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/sribalajiagency/backend
            rm -rf node_modules
            npm install --production --force
            pm2 delete sribalajiagency-backend || true
            pm2 start dist/main.js --name sribalajiagency-backend --node-args="--trace-warnings"
            pm2 save
