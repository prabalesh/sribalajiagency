name: Deploy to Hetzner

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Install root dependencies
      - name: Install root dependencies
        run: npm install

      # Backend Build
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: |
          npm run build
          ls -R dist

      # Clean server before deploy
      - name: Clean server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ~/sribalajiagency/backend
            # Just clear the dist folder to ensure a fresh deployment
            rm -rf ~/sribalajiagency/backend/dist

      # Deploy Backend
      - name: Deploy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/dist/**,backend/package.json,backend/package-lock.json,backend/src/database/drizzle/migrations/**,backend/scripts/**"
          target: "/home/${{ secrets.SSH_USERNAME }}/sribalajiagency/backend/"
          strip_components: 1
          overwrite: true

      # Restart Services
      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/sribalajiagency/backend
            echo "📂 Files in dist:"
            ls -R dist || echo "❌ dist folder not found!"
            
            echo "📦 Installing dependencies..."
            npm install --production --force
            
            echo "🚀 Running migrations..."
            npm run db:migrate:prod
            
            echo "🔄 Restarting PM2..."
            pm2 describe sribalajiagency-backend > /dev/null
            if [ $? -eq 0 ]; then
              echo "Reloading existing process..."
              pm2 reload sribalajiagency-backend --update-env
            else
              echo "Starting new process..."
              pm2 start dist/src/main.js --name sribalajiagency-backend --node-args="--trace-warnings"
            fi
            
            pm2 save
            echo "✅ Deployment completed!"
